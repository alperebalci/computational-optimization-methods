[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jors-pymoo-sustainable-factory-design"
version = "0.1.0"
description = "Multi-objective sustainable factory design with pymoo NSGA-II"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pymoo==0.6.2", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
