[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-evolutionary-optimization"
version = "0.1.0"
description = "Advanced evolutionary computation reference implementations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13,<14"]
distributed = ["mpi4py>=4,<5"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
