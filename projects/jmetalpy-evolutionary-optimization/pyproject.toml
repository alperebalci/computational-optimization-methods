[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jors-jmetalpy-nsgaii-benchmark"
version = "0.1.0"
description = "NSGA-II benchmark experiment with jMetalPy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jmetalpy==1.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
