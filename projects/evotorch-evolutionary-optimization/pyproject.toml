[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jors-evotorch-constrained-production"
version = "0.1.0"
description = "Tensorized constrained production optimization with EvoTorch PGPE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["evotorch==0.6.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
