[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jors-niapy-differential-evolution"
version = "0.1.0"
description = "Griewank optimization with NiaPy Differential Evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["niapy==2.7.1", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
