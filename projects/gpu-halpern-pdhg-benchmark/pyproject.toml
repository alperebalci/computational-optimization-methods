[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-halpern-pdhg-benchmark"
version = "0.1.0"
description = "Transparent PDHG and Halpern-style LP benchmark with optional CuPy execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
cuda12 = ["cupy-cuda12x>=13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
