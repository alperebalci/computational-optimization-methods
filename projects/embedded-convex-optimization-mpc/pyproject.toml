[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-convex-optimization-mpc"
version = "0.1.0"
description = "Parametric convex MPC benchmark across OSQP, Clarabel, and SCS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "cvxpy>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
