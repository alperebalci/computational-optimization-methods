[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jors-inspyred-rastrigin-es"
version = "0.1.0"
description = "Rastrigin evolution strategy benchmark with inspyred"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["inspyred==1.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
