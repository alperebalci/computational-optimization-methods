[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jors-mealpy-production-mix"
version = "0.1.0"
description = "Production-mix genetic algorithm with MEALPY"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mealpy==3.0.3", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
