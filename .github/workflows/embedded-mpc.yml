name: Embedded MPC

on:
  push:
    branches: [main]
    paths:
      - "projects/embedded-convex-optimization-mpc/**"
      - ".github/workflows/embedded-mpc.yml"
  pull_request:
    paths:
      - "projects/embedded-convex-optimization-mpc/**"
      - ".github/workflows/embedded-mpc.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/embedded-convex-optimization-mpc

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Receding-horizon smoke
        run: python -m embedded_mpc.experiment
