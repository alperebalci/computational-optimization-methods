name: Halpern PDHG

on:
  push:
    branches: [main]
    paths:
      - "projects/gpu-halpern-pdhg-benchmark/**"
      - ".github/workflows/halpern-pdhg.yml"
  pull_request:
    paths:
      - "projects/gpu-halpern-pdhg-benchmark/**"
      - ".github/workflows/halpern-pdhg.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/gpu-halpern-pdhg-benchmark

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: CPU benchmark smoke
        run: python -m halpern_pdhg.experiment
