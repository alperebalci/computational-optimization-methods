name: OR-AI research extensions
on:
  pull_request:
    paths:
      - 'projects/optimal-classification-trees-milp/**'
      - '.github/workflows/or-ai-research-extensions.yml'
  push:
    paths:
      - 'projects/optimal-classification-trees-milp/**'
      - '.github/workflows/or-ai-research-extensions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'scikit-learn>=1.4,<2'
      - name: Check optimal_trees
        working-directory: projects/optimal-classification-trees-milp
        run: |
          python -m unittest checks -v
          python study.py --output local-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-results-${{ matrix.python }}
          path: '**/local-results.json'
